# Documentation
# https://cromwell.readthedocs.io/en/stable/backends/Local/
#
# Local GPU backend for manual Cromwell smoke tests. This is intentionally not
# used by the standard local CI harness because it requires a host NVIDIA driver
# and Docker NVIDIA container runtime.

include required(classpath("application"))

backend {
  default = "LocalExample"
  providers {
    # Define a new backend provider.

    LocalExample {

      # The actor that runs the backend. In this case, it's the Shared File System (SFS) ConfigBackend.
      actor-factory = "cromwell.backend.impl.sfs.config.ConfigBackendLifecycleActorFactory"

      # The backend custom configuration.
      config {

        # Keep GPU tests serial so a single local device is not over-subscribed.
        concurrent-job-limit = 1

        # If true submits scripts to the bash background using "&". Only useful for dispatchers that do NOT submit
        # the job and then immediately return a scheduled job id.
        run-in-background = true

        # The list of possible runtime custom attributes. The GPU and cloud keys
        # are accepted locally so GPU workflows can share the same WDL runtime
        # block across Cromwell backends.
        runtime-attributes = """
        String? docker
        String? docker_user
        """

        # Submit string when there is no "docker" runtime attribute.
        submit = "/usr/bin/env bash ${script}"

        # Submit string when there is a "docker" runtime attribute.
        #
        # This mirrors cromwell.local-github_actions.conf but adds Docker GPU
        # exposure. If the host NVIDIA driver is unavailable, GPU tasks will
        # fail fast before LucaVirus execution.
        submit-docker = """
            docker run \
              --cidfile ${docker_cid} \
              -i \
              --gpus all \
              -e NVIDIA_VISIBLE_DEVICES=all \
              -e NVIDIA_DRIVER_CAPABILITIES=compute,utility \
              ${"--user " + docker_user} \
              --entrypoint /bin/bash \
              -v ${cwd}:${docker_cwd} \
              ${docker} ${docker_cwd}/execution/script
            rc=$(docker wait `cat ${docker_cid}`)
            docker rm `cat ${docker_cid}`
            exit $rc
        """

        # Root directory where Cromwell writes job results. This directory must be
        # visible and writeable by the Cromwell process as well as the jobs that Cromwell
        # launches.
        root = "cromwell-executions"

        # Root directory where Cromwell writes job results in the container. This value
        # can be used to specify where the execution folder is mounted in the container.
        dockerRoot = "/cromwell-executions"

        # File system configuration.
        filesystems {

          # For SFS backends, the "local" configuration specifies how files are handled.
          local {

            # Try to hard link (ln), then soft-link (ln -s), and if both fail, then copy the files.
            localization: [
              "hard-link", "soft-link", "copy"
            ]

            # Call caching strategies
            caching {
              duplication-strategy: [
                "hard-link", "soft-link", "copy"
              ]

              hashing-strategy: "md5"
              check-sibling-md5: false
            }
          }
        }

        # The defaults for runtime attributes if not provided.
        default-runtime-attributes {
          failOnStderr: false
          continueOnReturnCode: 0
        }
      }
    }
  }
}
